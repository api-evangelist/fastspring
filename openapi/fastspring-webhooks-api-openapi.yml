openapi: 3.2.0
info:
  title: FastSpring Webhooks API
  description: REST API for FastSpring's ecommerce / merchant-of-record platform.
  version: 1.0.0
  contact:
    name: FastSpring Developer Hub
    url: https://developer.fastspring.com
servers:
- url: https://api.fastspring.com
  description: FastSpring production API
security:
- BasicAuth: []
tags:
- name: Webhooks
paths:
  /webhooks/{webhook_id}/key:
    parameters:
    - in: path
      name: webhook_id
      required: true
      schema:
        type: string
    patch:
      tags:
      - Webhooks
      summary: Rotate a webhook's HMAC SHA-256 secret
      responses:
        '200':
          description: Rotated
      operationId: patchWebhooksByWebhookIdKey
      x-operation-id-source: derived
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic with credentials from FastSpring App Dashboard
