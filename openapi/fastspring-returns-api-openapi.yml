openapi: 3.2.0
info:
  title: FastSpring Returns API
  description: REST API for FastSpring's ecommerce / merchant-of-record platform.
  version: 1.0.0
  contact:
    name: FastSpring Developer Hub
    url: https://developer.fastspring.com
servers:
- url: https://api.fastspring.com
  description: FastSpring production API
security:
- BasicAuth: []
tags:
- name: Returns
paths:
  /returns:
    post:
      tags:
      - Returns
      summary: Create a return / refund request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Return
      operationId: postReturns
      x-operation-id-source: derived
  /returns/{return_id}:
    parameters:
    - in: path
      name: return_id
      required: true
      schema:
        type: string
    get:
      tags:
      - Returns
      summary: Retrieve a return
      responses:
        '200':
          description: Return
      operationId: getReturnsByReturnId
      x-operation-id-source: derived
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic with credentials from FastSpring App Dashboard
