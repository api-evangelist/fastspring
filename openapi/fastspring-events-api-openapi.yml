openapi: 3.2.0
info:
  title: FastSpring Events API
  description: REST API for FastSpring's ecommerce / merchant-of-record platform.
  version: 1.0.0
  contact:
    name: FastSpring Developer Hub
    url: https://developer.fastspring.com
servers:
- url: https://api.fastspring.com
  description: FastSpring production API
security:
- BasicAuth: []
tags:
- name: Events
paths:
  /events:
    get:
      tags:
      - Events
      summary: List processed / unprocessed webhook events
      responses:
        '200':
          description: Events
      operationId: getEvents
      x-operation-id-source: derived
  /events/{event_id}:
    parameters:
    - in: path
      name: event_id
      required: true
      schema:
        type: string
    post:
      tags:
      - Events
      summary: Mark an event as processed
      responses:
        '200':
          description: Updated
      operationId: postEventsByEventId
      x-operation-id-source: derived
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic with credentials from FastSpring App Dashboard
