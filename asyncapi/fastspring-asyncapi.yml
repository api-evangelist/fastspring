              items:
                $ref: '#/components/schemas/SubscriptionPaymentReminderEvent'

    WebhookEnvelopeSubscriptionTrialReminder:
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelope'
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionTrialReminderEvent'

    WebhookEnvelopeSubscriptionUncanceled:
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelope'
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionUncanceledEvent'

    WebhookEnvelopeSubscriptionUpdated:
      allOf:
        - $ref: '#/components/schemas/WebhookEnvelope'
        - type: object
          properties:
            events:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionUpdatedEvent'

    AccountData:
      type: object
      description: >-
        Customer account payload. Includes the FastSpring account id and
        nested contact details (name, email, company, phone), address,
        language, country, and an account-management URL. Refer to the
        FastSpring account.created / account.updated documentation for
        the authoritative field list.
      additionalProperties: true
      properties:
        id:
          type: string
          description: FastSpring account id.
        account:
          type: string
          description: Account reference identifier.
        contact:
          type: object
          additionalProperties: true
          description: Buyer contact details (first, last, email, company, phone, subscribed).
        address:
          type: object
          additionalProperties: true
          description: Postal address (region, city, regionCode, postalCode, country, display).
        language:
          type: string
        country:
          type: string
        lookup:
          type: object
          additionalProperties: true
          description: Lookup keys (e.g. custom, global).
        url:
          type: string
          format: uri

    OrderData:
      type: object
      description: >-
        Order payload. Spans identifiers (order, id, reference,
        buyerReference), order configuration (language, live, currency,
        payoutCurrency, quote, invoiceUrl, siteId,
        acquisitionTransactionType), pricing (total, tax, subtotal,
        discount with display + payout currency variants), payment
        details (billDescriptor, payment.type, cardEnding, creditcard
        brand, bank, variant), account + customer contact and address,
        recipients, items (with fulfillments, withholdings, proratedItem),
        and internal notes. See the FastSpring docs for the authoritative
        field list per order event.
      additionalProperties: true
      properties:
        order:
          type: string
        id:
          type: string
        reference:
          type: string
        buyerReference:
          type: string
        ipAddress:
          type: string
        completed:
          type: boolean
        changed:
          type: integer
          format: int64
        changedInSeconds:
          type: integer
          format: int64
        language:
          type: string
        live:
          type: boolean
        currency:
          type: string
        payoutCurrency:
          type: string
        quote:
          type: string
        invoiceUrl:
          type: string
          format: uri
        siteId:
          type: string
        acquisitionTransactionType:
          type: string
        total:
          type: number
        totalDisplay:
          type: string
        totalInPayoutCurrency:
          type: number
        totalInPayoutCurrencyDisplay:
          type: string
        tax:
          type: number
        subtotal:
          type: number
        discount:
          type: number
        discountWithTax:
          type: number
        billDescriptor:
          type: string
        payment:
          type: object
          additionalProperties: true
        account:
          $ref: '#/components/schemas/AccountData'
        customer:
          type: object
          additionalProperties: true
        address:
          type: object
          additionalProperties: true
        recipients:
          type: array
          items:
            type: object
            additionalProperties: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        notes:
          type: array
          items:
            type: object
            additionalProperties: true
        tags:
          type: object
          additionalProperties: true

    ChargebackData:
      type: object
      description: >-
        Chargeback payload accompanying order.chargeback events. Includes
        the originating order reference and dispute metadata. Refer to
        the FastSpring chargeback documentation for the authoritative
        field list.
      additionalProperties: true
      properties:
        order:
          type: string
        reference:
          type: string
        amount:
          type: number
        amountDisplay:
          type: string
        currency:
          type: string

    MailingListEntryData:
      type: object
      description: >-
        Mailing-list entry payload (abandoned-cart / remarketing capture).
        Includes the captured buyer contact details and any associated
        cart context. Refer to the FastSpring mailingListEntry webhook
        documentation for the authoritative field list.
      additionalProperties: true
      properties:
        email:
          type: string
          format: email
        first:
          type: string
        last:
          type: string
        company:
          type: string
        language:
          type: string
        country:
          type: string
        subscribed:
          type: boolean

    QuoteData:
      type: object
      description: >-
        Quote payload. Includes quote id, status, customer/account
        references, line items, totals, valid-through dates, and the
        buyer-facing quote URL. Refer to the FastSpring quote.created /
        quote.updated documentation for the authoritative field list.
      additionalProperties: true
      properties:
        id:
          type: string
        quote:
          type: string
        status:
          type: string
        account:
          type: string
        url:
          type: string
          format: uri
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    ReturnData:
      type: object
      description: >-
        Return / refund payload. Includes return id, the originating
        order, refunded amount and currency variants, reason, and
        per-item refund detail. Refer to the FastSpring return.created
        documentation for the authoritative field list.
      additionalProperties: true
      properties:
        id:
          type: string
        order:
          type: string
        reference:
          type: string
        reason:
          type: string
        currency:
          type: string
        total:
          type: number
        totalDisplay:
          type: string
        totalInPayoutCurrency:
          type: number
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    PayoutEntryData:
      type: object
      description: >-
        Payout-entry payload. Represents an order or return entry queued
        for payout processing. Refer to the FastSpring payoutEntry.created
        documentation for the authoritative field list.
      additionalProperties: true
      properties:
        id:
          type: string
        order:
          type: string
        type:
          type: string
        currency:
          type: string
        amount:
          type: number

    FulfillmentFailureData:
      type: object
      description: >-
        Fulfillment failure payload. Identifies the order, item, and
        failed fulfillment action (license, file, script) plus an error
        description. Refer to the FastSpring fulfillment.failed
        documentation for the authoritative field list.
      additionalProperties: true
      properties:
        order:
          type: string
        item:
          type: string
        fulfillment:
          type: string
        error:
          type: string

    SubscriptionData:
      type: object
      description: >-
        Subscription payload. Includes subscription id, active flag, and
        state (active, overdue, deactivated, trial, canceled); account
        and contact details; full product object; pricing (base, display,
        subtotal with setup, payout-currency variants, add-ons); billing
        schedule (begin, next, end, intervals, periods); dunning
        notification settings; and a fulfillments array for non-rebill
        deliverables. Refer to the per-subscription event docs for the
        authoritative field list.
      additionalProperties: true
      properties:
        id:
          type: string
        subscription:
          type: string
        active:
          type: boolean
        state:
          type: string
          enum:
            - active
            - overdue
            - deactivated
            - trial
            - canceled
        changed:
          type: integer
          format: int64
        live:
          type: boolean
        currency:
          type: string
        account:
          $ref: '#/components/schemas/AccountData'
        product:
          type: object
          additionalProperties: true
        price:
          type: number
        priceDisplay:
          type: string
        subtotal:
          type: number
        priceInPayoutCurrency:
          type: number
        begin:
          type: integer
          format: int64
        next:
          type: integer
          format: int64
        end:
          type: integer
          format: int64
        intervalUnit:
          type: string
        intervalLength:
          type: integer
        periods:
          type: integer
        addons:
          type: array
          items:
            type: object
            additionalProperties: true
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        fulfillments:
          type: object
          additionalProperties: true
        tags:
          type: object
          additionalProperties: true

    SubscriptionChargeData:
      type: object
      description: >-
        Subscription charge payload. Wraps the subscription identity plus
        a nested order representing the charge attempt (success or
        failure). Refer to the FastSpring subscription.charge.completed
        and subscription.charge.failed documentation for the
        authoritative field list.
      additionalProperties: true
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionData'
        order:
          $ref: '#/components/schemas/OrderData'
        reason:
          type: string
          description: Failure reason when present (charge.failed).
